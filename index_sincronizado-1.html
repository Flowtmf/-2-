<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#2 ♥️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Outfit:wght@300;400;500;700&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #1e0b30 0%, #08030d 100%);
        }

        /* Reproductor Superior */
        .player-wrapper {
            width: 100%;
            padding: 40px 20px 10px;
            display: flex;
            justify-content: center;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(8, 3, 13, 1) 40%, rgba(8, 3, 13, 0) 100%);
        }

        .glass-panel {
            width: 100%;
            max-width: 550px;
            text-align: center;
            padding: 10px 20px;
        }

        .chapter {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 600;
            color: #f2e6ff;
            margin: 0;
            line-height: 1;
            text-shadow: 0 10px 30px rgba(184, 134, 255, 0.3);
        }

        .heart {
            font-style: normal;
            font-size: 1.5rem;
            color: #b886ff;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 20px rgba(184, 134, 255, 0.8); }
        }

        canvas {
            width: 100%;
            height: 30px;
            margin: 20px 0;
        }

        /* Controles */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-icon:hover {
            color: #ffffff;
            transform: scale(1.1);
        }

        .btn-play-main {
            width: 65px;
            height: 65px;
            color: #eaddff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            backdrop-filter: blur(10px);
        }

        .btn-play-main:hover {
            background: rgba(184, 134, 255, 0.2);
            color: #ffffff;
            transform: scale(1.05);
        }

        .btn-icon svg { width: 22px; height: 22px; fill: currentColor; }
        .btn-play-main svg { width: 26px; height: 26px; }
        #icon-play { margin-left: 4px; }

        /* Estilo SPOTIFY para las letras */
        .lyrics-section {
            flex: 1;
            width: 100%;
            max-width: 800px;
            padding: 0 30px;
            overflow-y: auto;
            scroll-behavior: smooth; /* Movimiento suave */
            /* Ocultar barra de scroll para que se vea limpio */
            -ms-overflow-style: none;  
            scrollbar-width: none;  
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        .lyrics-section::-webkit-scrollbar {
            display: none;
        }

        #lyrics-container {
            /* Espacio arriba y abajo para que la primera y última frase puedan quedar en el centro de la pantalla */
            padding: 40vh 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px; /* Espacio entre frases */
        }

        .lyric-line {
            font-family: 'Outfit', sans-serif; /* Letra moderna y limpia estilo Spotify */
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            color: #ffffff;
            opacity: 0.25; /* Opacas por defecto */
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); /* Transición súper suave */
            text-align: center;
            transform-origin: center;
            cursor: pointer;
        }

        /* La frase que está sonando AHORA */
        .lyric-line.active {
            opacity: 1;
            font-size: 2.2rem;
            text-shadow: 0 0 25px rgba(216, 180, 255, 0.4);
            transform: scale(1.05);
        }

        /* Frases que ya pasaron (un poco más opacas para dar enfoque a la actual) */
        .lyric-line.past {
            opacity: 0.15;
        }

    </style>
</head>
<body>

    <div class="player-wrapper">
        <div class="glass-panel">
            <h1 class="chapter">#2 <span class="heart">♥️</span></h1>
            
            <canvas id="visualizer"></canvas>
            
            <div class="controls">
                <button id="btn-rewind" class="btn-icon">
                    <svg viewBox="0 0 24 24"><path d="M12.5 9.513c3.486 0 6.643 1.54 8.802 4.103l-2.073 2.054a8.97 8.97 0 0 0-6.729-3.157v3.487L4.5 10l8-6v5.513zm2.5 7.487a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0zm-2 0a3.5 3.5 0 1 0-7 0 3.5 3.5 0 0 0 7 0z"/></svg>
                </button>
                
                <button id="btn-play" class="btn-icon btn-play-main">
                    <svg id="icon-play" viewBox="0 0 24 24"><path d="M7 6v12l10-6z"/></svg>
                    <svg id="icon-pause" viewBox="0 0 24 24" style="display:none; margin-left:0;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>

                <button id="btn-forward" class="btn-icon">
                    <svg viewBox="0 0 24 24"><path d="M11.5 9.513V4l8 6-8 6v-3.487a8.97 8.97 0 0 0-6.729 3.157l-2.073-2.054c2.159-2.563 5.316-4.103 8.802-4.103zm-2.5 7.487a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0zm-2 0a3.5 3.5 0 1 0-7 0 3.5 3.5 0 0 0 7 0z"/></svg>
                </button>
            </div>
            
            <audio id="myAudio" src="poema.mp3"></audio>
        </div>
    </div>

    <!-- Contenedor con Scroll Automático -->
    <div class="lyrics-section" id="scroll-box">
        <div id="lyrics-container"></div>
    </div>

    <script>
        const poema = [
            { time: 0.89, text: "Mi amor…" },
            { time: 3.57, text: "Si estás escuchando esto probablemente acabas de despertar…" },
            { time: 8.02, text: "Y mientras tú abrías los ojos," },
            { time: 10.7, text: "quizá yo todavía estaba con los míos cerrados," },
            { time: 13.37, text: "intentando recuperar un poquito del sueño que perdí por quedarme aquí pensando en ti." },
            { time: 18.72, text: "Pero ¿sabes qué?" },
            { time: 20.5, text: "No me arrepiento." },
            { time: 22.28, text: "Porque hay noches en las que dormir puede esperar." },
            { time: 25.85, text: "Hay noches en las que uno siente que tiene demasiadas cosas guardadas en el corazón" },
            { time: 29.41, text: "y necesita sacarlas," },
            { time: 31.2, text: "aunque sean las tres de la mañana," },
            { time: 33.87, text: "aunque mañana esté cansado," },
            { time: 35.65, text: "aunque al día siguiente tenga los ojos pesados." },
            { time: 39.22, text: "Y esta es una de esas noches." },
            { time: 41.89, text: "Porque hoy no quería simplemente mandarte un:" },
            { time: 44.57, text: "“Te amo, mi vida.”" },
            { time: 47.24, text: "No." },
            { time: 49.02, text: "Hoy quería que escucharas todo aquello que a veces no sé cómo decirte." },
            { time: 53.48, text: "Quería que escucharas mi voz y que, por unos minutos, sintieras que estoy ahí contigo." },
            { time: 58.83, text: "Como si estuviera sentado frente a ti." },
            { time: 61.5, text: "Como si pudiera mirarte mientras te digo cada palabra." },
            { time: 65.07, text: "Y probablemente me pondría nervioso." },
            { time: 67.74, text: "Probablemente me reiría entre algunas frases." },
            { time: 70.42, text: "Probablemente olvidaría alguna cosa que quería decir." },
            { time: 73.98, text: "Porque cuando se trata de ti…" },
            { time: 76.65, text: "hasta mi manera de hablar parece quedarse pequeña." },
            { time: 80.22, text: "Mi amor…" },
            { time: 82.89, text: "¿Sabes qué me parece increíble?" },
            { time: 85.57, text: "Que puedo mirarte y todavía sentir esa sensación de:" },
            { time: 89.13, text: "“¿Cómo puede gustarme tanto una persona?”" },
            { time: 92.7, text: "Porque no es solamente que me parezcas hermosa." },
            { time: 96.26, text: "Es que hay algo en ti que hace que mi mirada quiera quedarse." },
            { time: 99.83, text: "Tu rostro tiene detalles que quizá tú ni siquiera notas." },
            { time: 103.39, text: "La forma de tus ojos." },
            { time: 105.18, text: "La manera en que cambia tu expresión cuando algo te emociona." },
            { time: 108.74, text: "Tu sonrisa cuando intentas esconder que estás feliz." },
            { time: 112.31, text: "La forma en que haces determinadas caras cuando estás enojada." },
            { time: 115.87, text: "Hasta esos pequeños gestos tuyos que probablemente haces sin pensarlo…" },
            { time: 119.44, text: "yo los voy guardando." },
            { time: 121.22, text: "Como quien recoge pequeñas estrellas y las mete cuidadosamente en un bolsillo para no perderlas." },
            { time: 126.57, text: "Y tu cabello…" },
            { time: 128.35, text: "No sé cómo explicarlo." },
            { time: 130.13, text: "Hay días en los que simplemente te miro y pienso que hasta la manera en que cae tu cabello parece tener su propio idioma." },
            { time: 136.37, text: "Como si cada mechón supiera algo de ti que yo todavía estoy aprendiendo." },
            { time: 140.83, text: "Y me encanta." },
            { time: 142.61, text: "Me encanta mirarte." },
            { time: 144.4, text: "Me encanta descubrirte." },
            { time: 146.18, text: "Me encanta observar esas pequeñas cosas que quizá para ti son completamente normales," },
            { time: 150.64, text: "pero que para mí se vuelven recuerdos." },
            { time: 153.31, text: "Y sí…" },
            { time: 155.09, text: "Me fascina cómo te ves." },
            { time: 157.77, text: "Tu forma de vestir." },
            { time: 159.55, text: "Tu manera de caminar." },
            { time: 161.33, text: "Tu silueta." },
            { time: 163.11, text: "Tus manos." },
            { time: 164.9, text: "Tu sonrisa." },
            { time: 166.68, text: "Tu forma de arreglarte." },
            { time: 168.46, text: "Tu forma de no arreglarte." },
            { time: 171.14, text: "Porque hay algo que quiero que entiendas:" },
            { time: 173.81, text: "no tienes que estar producida para que yo te vea hermosa." },
            { time: 177.38, text: "Puedes estar recién despertando." },
            { time: 180.05, text: "Puedes estar despeinada." },
            { time: 181.83, text: "Puedes estar cansada." },
            { time: 183.62, text: "Puedes estar con ropa cómoda." },
            { time: 185.4, text: "Puedes estar haciendo absolutamente nada." },
            { time: 188.07, text: "Y yo seguiría encontrando belleza en ti." },
            { time: 191.64, text: "Porque no es una belleza que dependa de un espejo." },
            { time: 195.2, text: "Es una belleza que yo encuentro incluso cuando tú no estás intentando demostrarla." },
            { time: 200.55, text: "Y hay algo que me gusta todavía más que tu belleza." },
            { time: 204.12, text: "Tu forma de ser." },
            { time: 205.9, text: "Porque podría hablar durante horas de tus ojos, de tu sonrisa, de tu cabello…" },
            { time: 210.36, text: "pero si mañana todo eso desapareciera y solamente pudiera conservar una cosa de ti…" },
            { time: 214.81, text: "elegiría tu esencia." },
            { time: 216.59, text: "Tu manera de sentir." },
            { time: 218.38, text: "Tu manera de querer." },
            { time: 220.16, text: "Tu forma de emocionarte por ciertas cosas." },
            { time: 222.83, text: "Tus ocurrencias." },
            { time: 224.62, text: "Tus enojos." },
            { time: 226.4, text: "Tus momentos de ternura." },
            { time: 228.18, text: "Tu forma de preocuparte." },
            { time: 229.96, text: "Tus pequeños detalles." },
            { time: 231.75, text: "Esa persona que eres cuando nadie está mirando." },
            { time: 235.31, text: "Porque ahí es donde yo realmente me enamoro." },
            { time: 238.88, text: "No solamente de la chica que todos pueden ver." },
            { time: 241.55, text: "Sino de la persona que yo he tenido la oportunidad de conocer." },
            { time: 246.01, text: "Y eso para mí vale muchísimo." },
            { time: 249.57, text: "A veces pienso que el amor se parece al cielo." },
            { time: 253.14, text: "Porque uno lo mira y piensa que solamente está viendo una extensión enorme de azul o de oscuridad…" },
            { time: 258.49, text: "pero cuando observa con atención descubre miles de cosas." },
            { time: 262.94, text: "Una estrella." },
            { time: 264.73, text: "Otra." },
            { time: 266.51, text: "Una constelación." },
            { time: 268.29, text: "Una luna." },
            { time: 270.07, text: "Una nube." },
            { time: 271.86, text: "Un pequeño punto de luz." },
            { time: 274.53, text: "Y contigo me pasa exactamente eso." },
            { time: 277.21, text: "Mientras más te conozco, más cosas encuentro." },
            { time: 280.77, text: "Y lo curioso es que no me canso." },
            { time: 283.44, text: "Al contrario." },
            { time: 285.23, text: "Quiero seguir descubriéndote." },
            { time: 287.9, text: "Quiero saber cuáles son tus sueños." },
            { time: 290.58, text: "Qué cosas te dan miedo." },
            { time: 292.36, text: "Qué cosas te hacen sentir orgullosa." },
            { time: 295.03, text: "Qué cosas quieres conseguir." },
            { time: 296.81, text: "Qué lugares quieres conocer." },
            { time: 298.6, text: "Qué canciones te hacen sentir algo." },
            { time: 301.27, text: "Qué recuerdos quieres guardar para siempre." },
            { time: 303.95, text: "Quiero conocer todas esas pequeñas piezas que forman el universo que llevas dentro." },
            { time: 309.29, text: "Porque si amarte fuera aprender un idioma…" },
            { time: 311.97, text: "yo no querría hablarlo perfectamente." },
            { time: 314.64, text: "Querría pasar toda mi vida aprendiendo palabras nuevas." },
            { time: 319.1, text: "Y mi amor…" },
            { time: 320.88, text: "quiero que sepas que te admiro." },
            { time: 323.55, text: "Muchísimo." },
            { time: 325.34, text: "Quizá no te lo digo tantas veces como debería." },
            { time: 328.01, text: "Pero te admiro." },
            { time: 329.79, text: "Admiro cuando te esfuerzas." },
            { time: 331.58, text: "Cuando vas al gimnasio aunque estés cansada." },
            { time: 334.25, text: "Cuando te propones algo y tratas de conseguirlo." },
            { time: 336.92, text: "Cuando sigues adelante aunque tengas un día horrible." },
            { time: 340.49, text: "Y por eso hoy quiero decirte algo que quizá necesites escuchar:" },
            { time: 344.95, text: "Estoy orgulloso de ti." },
            { time: 346.73, text: "No solamente de tus resultados." },
            { time: 349.4, text: "Estoy orgulloso de tu proceso." },
            { time: 352.08, text: "De cada pequeño paso." },
            { time: 353.86, text: "De cada vez que decides intentarlo otra vez." },
            { time: 356.53, text: "De cada momento en el que podrías haberte rendido y, aun así, continuaste." },
            { time: 361.88, text: "Y si algún día sientes que no avanzas…" },
            { time: 364.56, text: "quiero que recuerdes que incluso una semilla que parece estar quieta está trabajando debajo de la tierra." },
            { time: 370.8, text: "No todo crecimiento se puede ver." },
            { time: 373.47, text: "A veces crecer significa simplemente sobrevivir a un día difícil y levantarse al siguiente." },
            { time: 378.82, text: "Y yo voy a admirar también esa versión de ti." },
            { time: 382.38, text: "¿Y sabes qué es lo que más me gusta imaginar?" },
            { time: 385.95, text: "El futuro." },
            { time: 387.73, text: "No un futuro perfecto." },
            { time: 389.51, text: "Uno nuestro." },
            { time: 391.3, text: "Uno real." },
            { time: 393.08, text: "Me imagino despertando contigo algún día." },
            { time: 395.75, text: "Y quizá peleando porque ninguno quiere levantarse de la cama. 😂" },
            { time: 400.21, text: "Me imagino una mañana cualquiera." },
            { time: 402.88, text: "La luz entrando por la ventana." },
            { time: 405.56, text: "Tú caminando por la casa medio dormida." },
            { time: 408.23, text: "Yo preparando algo." },
            { time: 410.01, text: "Tú diciendo alguna cosa que me haga reír." },
            { time: 412.69, text: "Y pienso:" },
            { time: 414.47, text: "“Esto era lo que quería.”" },
            { time: 417.14, text: "No una vida perfecta." },
            { time: 418.93, text: "Una vida compartida." },
            { time: 421.6, text: "Porque para mí el amor no está solamente en los grandes momentos." },
            { time: 426.06, text: "Está en lo pequeño." },
            { time: 427.84, text: "En preguntar:" },
            { time: 429.62, text: "“¿Ya comiste?”" },
            { time: 431.41, text: "En guardar un pedacito de algo porque sabes que al otro le gusta." },
            { time: 434.97, text: "En mandar un mensaje porque viste algo que te recordó a esa persona." },
            { time: 439.43, text: "En llegar cansado y aun así querer escuchar cómo estuvo su día." },
            { time: 443.88, text: "En sentarse juntos sin necesidad de hablar." },
            { time: 446.56, text: "En saber que no tienes que estar entreteniendo al otro todo el tiempo para sentirte acompañado." },
            { time: 451.91, text: "Eso quiero contigo." },
            { time: 453.69, text: "Quiero lo extraordinario…" },
            { time: 456.36, text: "pero también quiero lo cotidiano." },
            { time: 459.04, text: "Porque creo que el amor verdadero no solamente vive en las fotografías bonitas." },
            { time: 463.49, text: "Vive en los martes aburridos." },
            { time: 466.17, text: "En las mañanas con sueño." },
            { time: 467.95, text: "En los días de lluvia." },
            { time: 469.73, text: "En las compras del supermercado." },
            { time: 472.41, text: "En las discusiones sobre qué película ver." },
            { time: 475.08, text: "En los abrazos después de un día difícil." },
            { time: 477.76, text: "En esas pequeñas cosas que nadie publica…" },
            { time: 480.43, text: "pero que terminan construyendo una vida." },
            { time: 484, text: "Y si algún día tenemos nuestra propia casa…" },
            { time: 486.67, text: "quiero que tenga recuerdos nuestros por todas partes." },
            { time: 490.23, text: "Cosas que quizá para cualquier otra persona no significarían nada." },
            { time: 493.8, text: "Pero para nosotros sí." },
            { time: 495.58, text: "Una fotografía." },
            { time: 497.37, text: "Un dibujo." },
            { time: 499.15, text: "Una pequeña nota." },
            { time: 500.93, text: "Algo que compramos juntos." },
            { time: 502.71, text: "Una cosa que hicimos en una tarde cualquiera." },
            { time: 505.39, text: "Y quiero que, años después, podamos mirar todo eso y decir:" },
            { time: 509.84, text: "“Mira todo lo que fuimos construyendo sin darnos cuenta.”" },
            { time: 514.3, text: "Quiero una vida que tenga huellas de los dos." },
            { time: 517.87, text: "Como si nuestra historia fuera dejando pequeñas estrellas en cada habitación." },
            { time: 522.32, text: "Y sí…" },
            { time: 524.11, text: "también quiero nuestras mascotas." },
            { time: 526.78, text: "Nuestros animales corriendo por ahí." },
            { time: 529.45, text: "La casa llena de pequeñas cosas que nos gusten." },
            { time: 533.02, text: "Nuestros rincones." },
            { time: 534.8, text: "Nuestros planes." },
            { time: 536.58, text: "Nuestras bromas." },
            { time: 538.37, text: "Nuestras costumbres." },
            { time: 540.15, text: "Y quizá un día, estando los dos viejitos," },
            { time: 542.82, text: "mirar hacia atrás y descubrir que aquello que alguna vez imaginamos cuando éramos jóvenes…" },
            { time: 548.17, text: "terminó convirtiéndose en nuestra realidad." },
            { time: 552.63, text: "Y si alguna vez me preguntas:" },
            { time: 555.3, text: "“¿Por qué yo?”" },
            { time: 557.08, text: "No sé si tendría una respuesta exacta." },
            { time: 559.76, text: "Porque el amor no siempre se puede explicar." },
            { time: 563.32, text: "Uno puede enumerar mil razones…" },
            { time: 566, text: "pero siempre queda una parte que simplemente se siente." },
            { time: 569.56, text: "Podría decir:" },
            { time: 571.35, text: "Porque me haces reír." },
            { time: 573.13, text: "Porque me haces sentir querido." },
            { time: 574.91, text: "Porque eres hermosa." },
            { time: 576.69, text: "Porque me inspiras." },
            { time: 578.48, text: "Porque me importas." },
            { time: 580.26, text: "Porque me encanta hablar contigo." },
            { time: 582.04, text: "Porque me gusta verte feliz." },
            { time: 583.82, text: "Porque quiero cuidarte." },
            { time: 585.61, text: "Pero ninguna de esas razones explica completamente por qué mi corazón te eligió." },
            { time: 590.96, text: "Es como intentar explicar por qué una canción te emociona." },
            { time: 594.52, text: "Puedes hablar de la letra." },
            { time: 596.3, text: "Del ritmo." },
            { time: 598.09, text: "De la melodía." },
            { time: 599.87, text: "Pero hay algo más." },
            { time: 601.65, text: "Algo que simplemente ocurre dentro." },
            { time: 604.33, text: "Y contigo me pasa eso." },
            { time: 607, text: "Y quiero decirte algo que quizá suene loco…" },
            { time: 610.56, text: "pero si algún día la vida me llevara por un camino diferente al que imaginé…" },

        const audio = document.getElementById('myAudio');
        const btnPlay = document.getElementById('btn-play');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const btnRewind = document.getElementById('btn-rewind');
        const btnForward = document.getElementById('btn-forward');
        const lyricsContainer = document.getElementById('lyrics-container');
        const scrollBox = document.getElementById('scroll-box');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        let audioContext, analyser, source, isPlaying = false;
        let currentActiveIndex = -1;

        // Cargar las frases en el HTML
        poema.forEach((line, index) => {
            const p = document.createElement('p');
            p.className = 'lyric-line';
            p.id = `line-${index}`;
            p.innerText = line.text;
            
            // Si el usuario toca una frase, el audio salta a ese momento (Como Spotify)
            p.addEventListener('click', () => {
                audio.currentTime = line.time;
                if(audio.paused) btnPlay.click();
            });

            lyricsContainer.appendChild(p);
        });

        // Controles de Reproducción
        btnPlay.addEventListener('click', () => {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                analyser.fftSize = 64; 
                drawVisualizer();
            }
            if (audio.paused) {
                audio.play();
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
                isPlaying = true;
            } else {
                audio.pause();
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
                isPlaying = false;
            }
        });

        btnRewind.addEventListener('click', () => audio.currentTime = Math.max(0, audio.currentTime - 5));
        btnForward.addEventListener('click', () => audio.currentTime = Math.min(audio.duration, audio.currentTime + 5));

        // Lógica de Sincronización y Auto-Scroll
        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;
            let newActiveIndex = -1;

            // Buscar qué frase debería estar sonando ahora
            for (let i = 0; i < poema.length; i++) {
                const nextLineTime = poema[i + 1] ? poema[i + 1].time : audio.duration || 9999;
                if (currentTime >= poema[i].time && currentTime < nextLineTime) {
                    newActiveIndex = i;
                    break;
                }
            }

            // Si cambió la frase activa, actualizamos el diseño y hacemos Scroll
            if (newActiveIndex !== currentActiveIndex && newActiveIndex !== -1) {
                
                // Limpiar la clase de la frase anterior
                if (currentActiveIndex !== -1) {
                    const prevElement = document.getElementById(`line-${currentActiveIndex}`);
                    prevElement.classList.remove('active');
                    prevElement.classList.add('past'); // Se marca como pasada para bajarle la opacidad
                }

                // Activar la frase nueva
                const activeElement = document.getElementById(`line-${newActiveIndex}`);
                activeElement.classList.remove('past');
                activeElement.classList.add('active');
                
                currentActiveIndex = newActiveIndex;

                // MAGIA DEL AUTO-SCROLL: Centrar la frase activa en la pantalla suavemente
                activeElement.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });
            }
        });

        // Visualizador de Audio (Las barras que se mueven con la voz)
        function drawVisualizer() {
            if (!isPlaying) { requestAnimationFrame(drawVisualizer); return; }
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const totalBars = bufferLength / 2;
            const barWidth = (canvas.width / totalBars) * 0.4; 
            let x = 0;
            for (let i = 0; i < totalBars; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height * 0.9; 
                ctx.fillStyle = 'rgba(216, 180, 255, 0.5)'; 
                const y = (canvas.height - barHeight) / 2;
                ctx.beginPath();
                ctx.roundRect(x, y, barWidth, barHeight, [20]);
                ctx.fill();
                x += (canvas.width / totalBars);
            }
            requestAnimationFrame(drawVisualizer);
        }
    </script>
