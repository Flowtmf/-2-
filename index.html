<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#2 ♥️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Outfit:wght@300;400;500;700&display=swap');

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #1e0b30 0%, #08030d 100%);
        }

        /* Reproductor Superior */
        .player-wrapper {
            width: 100%;
            padding: 40px 20px 10px;
            display: flex;
            justify-content: center;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(8, 3, 13, 1) 40%, rgba(8, 3, 13, 0) 100%);
        }

        .glass-panel {
            width: 100%;
            max-width: 550px;
            text-align: center;
            padding: 10px 20px;
        }

        .chapter {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3.5rem;
            font-weight: 600;
            color: #f2e6ff;
            margin: 0;
            line-height: 1;
            text-shadow: 0 10px 30px rgba(184, 134, 255, 0.3);
        }

        .heart {
            font-style: normal;
            font-size: 1.5rem;
            color: #b886ff;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 20px rgba(184, 134, 255, 0.8); }
        }

        canvas {
            width: 100%;
            height: 30px;
            margin: 20px 0;
        }

        /* Controles */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-icon:hover {
            color: #ffffff;
            transform: scale(1.1);
        }

        .btn-play-main {
            width: 65px;
            height: 65px;
            color: #eaddff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            backdrop-filter: blur(10px);
        }

        .btn-play-main:hover {
            background: rgba(184, 134, 255, 0.2);
            color: #ffffff;
            transform: scale(1.05);
        }

        .btn-icon svg { width: 22px; height: 22px; fill: currentColor; }
        .btn-play-main svg { width: 26px; height: 26px; }
        #icon-play { margin-left: 4px; }

        /* Estilo SPOTIFY para las letras */
        .lyrics-section {
            flex: 1;
            width: 100%;
            max-width: 800px;
            padding: 0 30px;
            overflow-y: auto;
            scroll-behavior: smooth; /* Movimiento suave */
            /* Ocultar barra de scroll para que se vea limpio */
            -ms-overflow-style: none;  
            scrollbar-width: none;  
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        .lyrics-section::-webkit-scrollbar {
            display: none;
        }

        #lyrics-container {
            padding: 35vh 20px;
            display: block;
            text-align: center;
        }

        .lyric-line {
            font-family: 'Outfit', sans-serif;
            font-size: 1.55rem;
            line-height: 1.9;
            font-weight: 500;
            margin: 0 auto;
            color: rgba(255,255,255,.18);
            text-align: center;
            max-width: 760px;
        }
        .lyric-line .char {
            display: inline;
            color: rgba(255,255,255,.16);
            transition: color .16s ease, text-shadow .16s ease;
        }
        .lyric-line .char.lit {
            color: #fff;
            text-shadow: 0 0 10px rgba(216,180,255,.55);
        }
        .lyric-line .char.current {
            color: #f2e6ff;
            text-shadow: 0 0 16px rgba(216,180,255,.85);
        }

    </style>
</head>
<body>

    <div class="player-wrapper">
        <div class="glass-panel">
            <h1 class="chapter">#2 <span class="heart">♥️</span></h1>
            
            <canvas id="visualizer"></canvas>
            
            <div class="controls">
                <button id="btn-rewind" class="btn-icon">
                    <svg viewBox="0 0 24 24"><path d="M12.5 9.513c3.486 0 6.643 1.54 8.802 4.103l-2.073 2.054a8.97 8.97 0 0 0-6.729-3.157v3.487L4.5 10l8-6v5.513zm2.5 7.487a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0zm-2 0a3.5 3.5 0 1 0-7 0 3.5 3.5 0 0 0 7 0z"/></svg>
                </button>
                
                <button id="btn-play" class="btn-icon btn-play-main">
                    <svg id="icon-play" viewBox="0 0 24 24"><path d="M7 6v12l10-6z"/></svg>
                    <svg id="icon-pause" viewBox="0 0 24 24" style="display:none; margin-left:0;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>

                <button id="btn-forward" class="btn-icon">
                    <svg viewBox="0 0 24 24"><path d="M11.5 9.513V4l8 6-8 6v-3.487a8.97 8.97 0 0 0-6.729 3.157l-2.073-2.054c2.159-2.563 5.316-4.103 8.802-4.103zm-2.5 7.487a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0zm-2 0a3.5 3.5 0 1 0-7 0 3.5 3.5 0 0 0 7 0z"/></svg>
                </button>
            </div>
            
            <audio id="myAudio" src="poema.mp3"></audio>
        </div>
    </div>

    <!-- Contenedor con Scroll Automático -->
    <div class="lyrics-section" id="scroll-box">
        <div id="lyrics-container"></div>
    </div>

    <script>
        const poema = [
            { time: 1.0, text: "Mi amor…" },
            { time: 4.0, text: "Si estás escuchando esto probablemente acabas de despertar…" },
            { time: 9.0, text: "Y mientras tú abrías los ojos," },
            { time: 12.0, text: "quizá yo todavía estaba con los míos cerrados," },
            { time: 15.0, text: "intentando recuperar un poquito del sueño que perdí por quedarme aquí pensando en ti." },
            { time: 21.0, text: "Pero ¿sabes qué?" },
            { time: 23.0, text: "No me arrepiento." },
            { time: 25.0, text: "Porque hay noches en las que dormir puede esperar." },
            { time: 29.0, text: "Hay noches en las que uno siente que tiene demasiadas cosas guardadas en el corazón" },
            { time: 33.0, text: "y necesita sacarlas," },
            { time: 35.0, text: "aunque sean las tres de la mañana," },
            { time: 38.0, text: "aunque mañana esté cansado," },
            { time: 40.0, text: "aunque al día siguiente tenga los ojos pesados." },
            { time: 44.0, text: "Y esta es una de esas noches." },
            { time: 47.0, text: "Porque hoy no quería simplemente mandarte un:" },
            { time: 50.0, text: "“Te amo, mi vida.”" },
            { time: 53.0, text: "No." },
            { time: 55.0, text: "Hoy quería que escucharas todo aquello que a veces no sé cómo decirte." },
            { time: 60.0, text: "Quería que escucharas mi voz y que, por unos minutos, sintieras que estoy ahí contigo." },
            { time: 66.0, text: "Como si estuviera sentado frente a ti." },
            { time: 69.0, text: "Como si pudiera mirarte mientras te digo cada palabra." },
            { time: 73.0, text: "Y probablemente me pondría nervioso." },
            { time: 76.0, text: "Probablemente me reiría entre algunas frases." },
            { time: 79.0, text: "Probablemente olvidaría alguna cosa que quería decir." },
            { time: 83.0, text: "Porque cuando se trata de ti…" },
            { time: 86.0, text: "hasta mi manera de hablar parece quedarse pequeña." },
            { time: 90.0, text: "Mi amor…" },
            { time: 93.0, text: "¿Sabes qué me parece increíble?" },
            { time: 96.0, text: "Que puedo mirarte y todavía sentir esa sensación de:" },
            { time: 100.0, text: "“¿Cómo puede gustarme tanto una persona?”" },
            { time: 104.0, text: "Porque no es solamente que me parezcas hermosa." },
            { time: 108.0, text: "Es que hay algo en ti que hace que mi mirada quiera quedarse." },
            { time: 112.0, text: "Tu rostro tiene detalles que quizá tú ni siquiera notas." },
            { time: 116.0, text: "La forma de tus ojos." },
            { time: 118.0, text: "La manera en que cambia tu expresión cuando algo te emociona." },
            { time: 122.0, text: "Tu sonrisa cuando intentas esconder que estás feliz." },
            { time: 126.0, text: "La forma en que haces determinadas caras cuando estás enojada." },
            { time: 130.0, text: "Hasta esos pequeños gestos tuyos que probablemente haces sin pensarlo…" },
            { time: 134.0, text: "yo los voy guardando." },
            { time: 136.0, text: "Como quien recoge pequeñas estrellas y las mete cuidadosamente en un bolsillo para no perderlas." },
            { time: 142.0, text: "Y tu cabello…" },
            { time: 144.0, text: "No sé cómo explicarlo." },
            { time: 146.0, text: "Hay días en los que simplemente te miro y pienso que hasta la manera en que cae tu cabello parece tener su propio idioma." },
            { time: 153.0, text: "Como si cada mechón supiera algo de ti que yo todavía estoy aprendiendo." },
            { time: 158.0, text: "Y me encanta." },
            { time: 160.0, text: "Me encanta mirarte." },
            { time: 162.0, text: "Me encanta descubrirte." },
            { time: 164.0, text: "Me encanta observar esas pequeñas cosas que quizá para ti son completamente normales," },
            { time: 169.0, text: "pero que para mí se vuelven recuerdos." },
            { time: 172.0, text: "Y sí…" },
            { time: 174.0, text: "Me fascina cómo te ves." },
            { time: 177.0, text: "Tu forma de vestir." },
            { time: 179.0, text: "Tu manera de caminar." },
            { time: 181.0, text: "Tu silueta." },
            { time: 183.0, text: "Tus manos." },
            { time: 185.0, text: "Tu sonrisa." },
            { time: 187.0, text: "Tu forma de arreglarte." },
            { time: 189.0, text: "Tu forma de no arreglarte." },
            { time: 192.0, text: "Porque hay algo que quiero que entiendas:" },
            { time: 195.0, text: "no tienes que estar producida para que yo te vea hermosa." },
            { time: 199.0, text: "Puedes estar recién despertando." },
            { time: 202.0, text: "Puedes estar despeinada." },
            { time: 204.0, text: "Puedes estar cansada." },
            { time: 206.0, text: "Puedes estar con ropa cómoda." },
            { time: 208.0, text: "Puedes estar haciendo absolutamente nada." },
            { time: 211.0, text: "Y yo seguiría encontrando belleza en ti." },
            { time: 215.0, text: "Porque no es una belleza que dependa de un espejo." },
            { time: 219.0, text: "Es una belleza que yo encuentro incluso cuando tú no estás intentando demostrarla." },
            { time: 225.0, text: "Y hay algo que me gusta todavía más que tu belleza." },
            { time: 229.0, text: "Tu forma de ser." },
            { time: 231.0, text: "Porque podría hablar durante horas de tus ojos, de tu sonrisa, de tu cabello…" },
            { time: 236.0, text: "pero si mañana todo eso desapareciera y solamente pudiera conservar una cosa de ti…" },
            { time: 241.0, text: "elegiría tu esencia." },
            { time: 243.0, text: "Tu manera de sentir." },
            { time: 245.0, text: "Tu manera de querer." },
            { time: 247.0, text: "Tu forma de emocionarte por ciertas cosas." },
            { time: 250.0, text: "Tus ocurrencias." },
            { time: 252.0, text: "Tus enojos." },
            { time: 254.0, text: "Tus momentos de ternura." },
            { time: 256.0, text: "Tu forma de preocuparte." },
            { time: 258.0, text: "Tus pequeños detalles." },
            { time: 260.0, text: "Esa persona que eres cuando nadie está mirando." },
            { time: 264.0, text: "Porque ahí es donde yo realmente me enamoro." },
            { time: 268.0, text: "No solamente de la chica que todos pueden ver." },
            { time: 271.0, text: "Sino de la persona que yo he tenido la oportunidad de conocer." },
            { time: 276.0, text: "Y eso para mí vale muchísimo." },
            { time: 280.0, text: "A veces pienso que el amor se parece al cielo." },
            { time: 284.0, text: "Porque uno lo mira y piensa que solamente está viendo una extensión enorme de azul o de oscuridad…" },
            { time: 290.0, text: "pero cuando observa con atención descubre miles de cosas." },
            { time: 295.0, text: "Una estrella." },
            { time: 297.0, text: "Otra." },
            { time: 299.0, text: "Una constelación." },
            { time: 301.0, text: "Una luna." },
            { time: 303.0, text: "Una nube." },
            { time: 305.0, text: "Un pequeño punto de luz." },
            { time: 308.0, text: "Y contigo me pasa exactamente eso." },
            { time: 311.0, text: "Mientras más te conozco, más cosas encuentro." },
            { time: 315.0, text: "Y lo curioso es que no me canso." },
            { time: 318.0, text: "Al contrario." },
            { time: 320.0, text: "Quiero seguir descubriéndote." },
            { time: 323.0, text: "Quiero saber cuáles son tus sueños." },
            { time: 326.0, text: "Qué cosas te dan miedo." },
            { time: 328.0, text: "Qué cosas te hacen sentir orgullosa." },
            { time: 331.0, text: "Qué cosas quieres conseguir." },
            { time: 333.0, text: "Qué lugares quieres conocer." },
            { time: 335.0, text: "Qué canciones te hacen sentir algo." },
            { time: 338.0, text: "Qué recuerdos quieres guardar para siempre." },
            { time: 341.0, text: "Quiero conocer todas esas pequeñas piezas que forman el universo que llevas dentro." },
            { time: 347.0, text: "Porque si amarte fuera aprender un idioma…" },
            { time: 350.0, text: "yo no querría hablarlo perfectamente." },
            { time: 353.0, text: "Querría pasar toda mi vida aprendiendo palabras nuevas." },
            { time: 358.0, text: "Y mi amor…" },
            { time: 360.0, text: "quiero que sepas que te admiro." },
            { time: 363.0, text: "Muchísimo." },
            { time: 365.0, text: "Quizá no te lo digo tantas veces como debería." },
            { time: 368.0, text: "Pero te admiro." },
            { time: 370.0, text: "Admiro cuando te esfuerzas." },
            { time: 372.0, text: "Cuando vas al gimnasio aunque estés cansada." },
            { time: 375.0, text: "Cuando te propones algo y tratas de conseguirlo." },
            { time: 378.0, text: "Cuando sigues adelante aunque tengas un día horrible." },
            { time: 382.0, text: "Y por eso hoy quiero decirte algo que quizá necesites escuchar:" },
            { time: 387.0, text: "Estoy orgulloso de ti." },
            { time: 389.0, text: "No solamente de tus resultados." },
            { time: 392.0, text: "Estoy orgulloso de tu proceso." },
            { time: 395.0, text: "De cada pequeño paso." },
            { time: 397.0, text: "De cada vez que decides intentarlo otra vez." },
            { time: 400.0, text: "De cada momento en el que podrías haberte rendido y, aun así, continuaste." },
            { time: 406.0, text: "Y si algún día sientes que no avanzas…" },
            { time: 409.0, text: "quiero que recuerdes que incluso una semilla que parece estar quieta está trabajando debajo de la tierra." },
            { time: 416.0, text: "No todo crecimiento se puede ver." },
            { time: 419.0, text: "A veces crecer significa simplemente sobrevivir a un día difícil y levantarse al siguiente." },
            { time: 425.0, text: "Y yo voy a admirar también esa versión de ti." },
            { time: 429.0, text: "¿Y sabes qué es lo que más me gusta imaginar?" },
            { time: 433.0, text: "El futuro." },
            { time: 435.0, text: "No un futuro perfecto." },
            { time: 437.0, text: "Uno nuestro." },
            { time: 439.0, text: "Uno real." },
            { time: 441.0, text: "Me imagino despertando contigo algún día." },
            { time: 444.0, text: "Y quizá peleando porque ninguno quiere levantarse de la cama. 😂" },
            { time: 449.0, text: "Me imagino una mañana cualquiera." },
            { time: 452.0, text: "La luz entrando por la ventana." },
            { time: 455.0, text: "Tú caminando por la casa medio dormida." },
            { time: 458.0, text: "Yo preparando algo." },
            { time: 460.0, text: "Tú diciendo alguna cosa que me haga reír." },
            { time: 463.0, text: "Y pienso:" },
            { time: 465.0, text: "“Esto era lo que quería.”" },
            { time: 468.0, text: "No una vida perfecta." },
            { time: 470.0, text: "Una vida compartida." },
            { time: 473.0, text: "Porque para mí el amor no está solamente en los grandes momentos." },
            { time: 478.0, text: "Está en lo pequeño." },
            { time: 480.0, text: "En preguntar:" },
            { time: 482.0, text: "“¿Ya comiste?”" },
            { time: 484.0, text: "En guardar un pedacito de algo porque sabes que al otro le gusta." },
            { time: 488.0, text: "En mandar un mensaje porque viste algo que te recordó a esa persona." },
            { time: 493.0, text: "En llegar cansado y aun así querer escuchar cómo estuvo su día." },
            { time: 498.0, text: "En sentarse juntos sin necesidad de hablar." },
            { time: 501.0, text: "En saber que no tienes que estar entreteniendo al otro todo el tiempo para sentirte acompañado." },
            { time: 507.0, text: "Eso quiero contigo." },
            { time: 509.0, text: "Quiero lo extraordinario…" },
            { time: 512.0, text: "pero también quiero lo cotidiano." },
            { time: 515.0, text: "Porque creo que el amor verdadero no solamente vive en las fotografías bonitas." },
            { time: 520.0, text: "Vive en los martes aburridos." },
            { time: 523.0, text: "En las mañanas con sueño." },
            { time: 525.0, text: "En los días de lluvia." },
            { time: 527.0, text: "En las compras del supermercado." },
            { time: 530.0, text: "En las discusiones sobre qué película ver." },
            { time: 533.0, text: "En los abrazos después de un día difícil." },
            { time: 536.0, text: "En esas pequeñas cosas que nadie publica…" },
            { time: 539.0, text: "pero que terminan construyendo una vida." },
            { time: 543.0, text: "Y si algún día tenemos nuestra propia casa…" },
            { time: 546.0, text: "quiero que tenga recuerdos nuestros por todas partes." },
            { time: 550.0, text: "Cosas que quizá para cualquier otra persona no significarían nada." },
            { time: 554.0, text: "Pero para nosotros sí." },
            { time: 556.0, text: "Una fotografía." },
            { time: 558.0, text: "Un dibujo." },
            { time: 560.0, text: "Una pequeña nota." },
            { time: 562.0, text: "Algo que compramos juntos." },
            { time: 564.0, text: "Una cosa que hicimos en una tarde cualquiera." },
            { time: 567.0, text: "Y quiero que, años después, podamos mirar todo eso y decir:" },
            { time: 572.0, text: "“Mira todo lo que fuimos construyendo sin darnos cuenta.”" },
            { time: 577.0, text: "Quiero una vida que tenga huellas de los dos." },
            { time: 581.0, text: "Como si nuestra historia fuera dejando pequeñas estrellas en cada habitación." },
            { time: 586.0, text: "Y sí…" },
            { time: 588.0, text: "también quiero nuestras mascotas." },
            { time: 591.0, text: "Nuestros animales corriendo por ahí." },
            { time: 594.0, text: "La casa llena de pequeñas cosas que nos gusten." },
            { time: 598.0, text: "Nuestros rincones." },
            { time: 600.0, text: "Nuestros planes." },
            { time: 602.0, text: "Nuestras bromas." },
            { time: 604.0, text: "Nuestras costumbres." },
            { time: 606.0, text: "Y quizá un día, estando los dos viejitos," },
            { time: 609.0, text: "mirar hacia atrás y descubrir que aquello que alguna vez imaginamos cuando éramos jóvenes…" },
            { time: 615.0, text: "terminó convirtiéndose en nuestra realidad." },
            { time: 620.0, text: "Y si alguna vez me preguntas:" },
            { time: 623.0, text: "“¿Por qué yo?”" },
            { time: 625.0, text: "No sé si tendría una respuesta exacta." },
            { time: 628.0, text: "Porque el amor no siempre se puede explicar." },
            { time: 632.0, text: "Uno puede enumerar mil razones…" },
            { time: 635.0, text: "pero siempre queda una parte que simplemente se siente." },
            { time: 639.0, text: "Podría decir:" },
            { time: 641.0, text: "Porque me haces reír." },
            { time: 643.0, text: "Porque me haces sentir querido." },
            { time: 645.0, text: "Porque eres hermosa." },
            { time: 647.0, text: "Porque me inspiras." },
            { time: 649.0, text: "Porque me importas." },
            { time: 651.0, text: "Porque me encanta hablar contigo." },
            { time: 653.0, text: "Porque me gusta verte feliz." },
            { time: 655.0, text: "Porque quiero cuidarte." },
            { time: 657.0, text: "Pero ninguna de esas razones explica completamente por qué mi corazón te eligió." },
            { time: 663.0, text: "Es como intentar explicar por qué una canción te emociona." },
            { time: 667.0, text: "Puedes hablar de la letra." },
            { time: 669.0, text: "Del ritmo." },
            { time: 671.0, text: "De la melodía." },
            { time: 673.0, text: "Pero hay algo más." },
            { time: 675.0, text: "Algo que simplemente ocurre dentro." },
            { time: 678.0, text: "Y contigo me pasa eso." },
            { time: 681.0, text: "Y quiero decirte algo que quizá suene loco…" },
            { time: 685.0, text: "pero si algún día la vida me llevara por un camino diferente al que imaginé…" },
            { time: 690.0, text: "si alguna vez terminara en una ciudad distinta…" },
            { time: 693.0, text: "si el tiempo cambiara las circunstancias…" },

        const audio = document.getElementById('myAudio');
        const btnPlay = document.getElementById('btn-play');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const btnRewind = document.getElementById('btn-rewind');
        const btnForward = document.getElementById('btn-forward');
        const lyricsContainer = document.getElementById('lyrics-container');
        const scrollBox = document.getElementById('scroll-box');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        let audioContext, analyser, source, isPlaying = false;
        let currentActiveIndex = -1;

        // TODO EL TEXTO VISIBLE: se ilumina letra por letra siguiendo el audio.
        // Las frases se conservan en el orden original del poema.
        const allChars = [];
        poema.forEach((line, index) => {
            const p = document.createElement('p');
            p.className = 'lyric-line';
            p.id = `line-${index}`;

            [...line.text].forEach((char) => {
                const span = document.createElement('span');
                span.className = 'char';
                span.textContent = char;
                p.appendChild(span);
                if (char.trim()) allChars.push(span);
            });
            lyricsContainer.appendChild(p);
        });

        // Repartimos el progreso del audio sobre TODO el texto.
        // Así, mientras avanza tu voz, las letras se van encendiendo lentamente.
        let lastLit = -1;
        function updateLetterProgress() {
            const duration = audio.duration;
            if (!duration || !isFinite(duration) || !allChars.length) return;

            const progress = Math.max(0, Math.min(1, audio.currentTime / duration));
            const target = Math.min(allChars.length - 1, Math.floor(progress * allChars.length));

            if (target !== lastLit) {
                const from = Math.min(lastLit + 1, target);
                for (let i = from; i <= target; i++) allChars[i].classList.add('lit');
                if (lastLit >= 0 && allChars[lastLit]) allChars[lastLit].classList.remove('current');
                if (allChars[target]) allChars[target].classList.add('current');
                lastLit = target;

                // Mantener la letra que se está iluminando cerca del centro.
                if (allChars[target] && audio.currentTime > 2) {
                    allChars[target].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        // Controles de Reproducción
        btnPlay.addEventListener('click', () => {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                analyser.fftSize = 64;
                drawVisualizer();
            }
            if (audio.paused) {
                audio.play();
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
                isPlaying = true;
            } else {
                audio.pause();
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
                isPlaying = false;
            }
        });

        btnRewind.addEventListener('click', () => audio.currentTime = Math.max(0, audio.currentTime - 5));
        btnForward.addEventListener('click', () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5));

        audio.addEventListener('timeupdate', updateLetterProgress);
        audio.addEventListener('loadedmetadata', updateLetterProgress);
        audio.addEventListener('ended', () => {
            isPlaying = false;
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
            allChars.forEach(c => c.classList.add('lit'));
        });

        // Visualizador de Audio (Las barras que se mueven con la voz)
        function drawVisualizer() {
            if (!isPlaying) { requestAnimationFrame(drawVisualizer); return; }
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const totalBars = bufferLength / 2;
            const barWidth = (canvas.width / totalBars) * 0.4; 
            let x = 0;
            for (let i = 0; i < totalBars; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height * 0.9; 
                ctx.fillStyle = 'rgba(216, 180, 255, 0.5)'; 
                const y = (canvas.height - barHeight) / 2;
                ctx.beginPath();
                ctx.roundRect(x, y, barWidth, barHeight, [20]);
                ctx.fill();
                x += (canvas.width / totalBars);
            }
            requestAnimationFrame(drawVisualizer);
        }
    </script>
